# AI 角色扮演聊天應用配置文件
# AI Role Playing Chat App Configuration File

# 應用設置 / Application Settings
app:
  title: "AI 角色扮演聊天"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8000
  debug: true

# 資料庫設置 / Database Settings
database:
  type: "sqlite"
  path: "data/chat_data.db"
  
# AI 模型設置 / AI Model Settings
ai:
  default_model: "gemini-2.0-flash-exp"
  available_models:
    - "gemini-2.0-flash-exp"
    - "gemini-1.5-pro"
  default_response_length: 200
  max_response_length: 1000
  min_response_length: 50

# 檔案上傳設置 / File Upload Settings
upload:
  max_file_size: 10485760  # 10MB
  allowed_extensions:
    text: [".txt", ".docx"]
    image: [".jpg", ".jpeg", ".png", ".gif", ".webp"]
    video: [".mp4", ".avi", ".mov", ".wmv"]
  upload_dir: "uploads"

# 語言設置 / Language Settings
language:
  default: "zh-TW"
  available:
    - "zh-TW"
    - "en-US"

# 介面設置 / Interface Settings
ui:
  sidebar_width: 320
  message_max_width: "70%"
  auto_scroll: true
  show_typing_indicator: true

# 記憶設置 / Memory Settings
memory:
  max_memories: 100
  max_memory_length: 5000
  use_recent_memories: 3

# 匯出設置 / Export Settings
export:
  page_size: 10
  include_metadata: true
  format: "txt"

# 安全設置 / Security Settings
security:
  max_session_duration: 86400  # 24 hours in seconds
  max_concurrent_sessions: 10
  rate_limit_per_minute: 60

# 開發設置 / Development Settings
development:
  auto_reload: true
  log_level: "info"
  cors_enabled: true
  debug_toolbar: false